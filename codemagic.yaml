workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
      groups:
        - github_release
      vars:
        GITHUB_REPO: "Hardik-08/Student-dashboard"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync web assets into iOS project
        script: |
          npx cap sync ios
      - name: Build unsigned archive
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned ipa
        script: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cp ios/App/App/GoogleService-Info.plist build/Payload/App.app/GoogleService-Info.plist
          cd build
          zip -r App-unsigned.ipa Payload
      - name: Publish to GitHub Release (AltStore source)
        script: |
          command -v gh >/dev/null 2>&1 || brew install gh
          VERSION=$(date -u +%Y%m%d%H%M%S)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIZE=$(stat -f%z build/App-unsigned.ipa)
          printf '{"name":"Student Command Source","identifier":"com.soberhardik.studentdashboard.source","apps":[{"name":"Student Command","bundleIdentifier":"com.soberhardik.studentdashboard","developerName":"Mohit","version":"%s","versionDate":"%s","downloadURL":"https://github.com/%s/releases/download/latest/App-unsigned.ipa","localizedDescription":"Personal student dashboard app.","iconURL":"https://raw.githubusercontent.com/%s/main/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png","size":%s}]}' "$VERSION" "$DATE" "$GITHUB_REPO" "$GITHUB_REPO" "$SIZE" > build/apps.json
          cat build/apps.json
          gh release view latest --repo "$GITHUB_REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPO" --title "Latest Build" --notes "Automatically updated by Codemagic"
          gh release upload latest build/App-unsigned.ipa build/apps.json --repo "$GITHUB_REPO" --clobber
    artifacts:
      - build/App-unsigned.ipa
      - build/App.xcarchive
      - build/apps.json
