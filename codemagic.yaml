workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync web assets into iOS project
        script: |
          npx cap sync ios
      - name: Build unsigned archive
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned ipa
        script: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cp ios/App/App/GoogleService-Info.plist build/Payload/App.app/GoogleService-Info.plist
          cd build
          zip -r App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
      - build/App.xcarchive
